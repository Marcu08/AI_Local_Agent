[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-local"
version = "0.1.0"
description = "Assistente personale locale: loop ReAct, tool calling, whitelist filesystem e Human-in-the-Loop"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-q -m "not e2e" --strict-markers'
pythonpath = ["."]
markers = [
    "e2e: richiede un server Ollama in esecuzione; escluso di default",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
